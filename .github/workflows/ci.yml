name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run verify:pins
      - run: npm run verify:shafts
      # Shaft POSITIONING: the slide re-points a mate to a different station,
      # and the load-time re-seat derives poses from mates — so a regression
      # here shows up as a saved build reopening with its gears in the wrong
      # place, which no other suite would catch.
      - run: npm run verify:slide
      # Offline/PWA. Every defect this catches exists only in the BUILT output —
      # an unsubstituted placeholder, a precache list naming files Rollup did
      # not emit, a manifest that is correct at the domain root and broken under
      # the Pages base — so it runs after the build, against dist/.
      - run: npm run verify:pwa
      # Guards Copy/Paste id remapping + mate scoping and the Brain Gen 2
      # asset. Runs on Linux, so it also catches filename-casing regressions
      # that a case-insensitive Windows checkout would hide before they reach
      # GitHub Pages.
      - run: npm run verify:copy-paste
      # Fails when a PRODUCTION pin endpoint or pin receiver is missing the
      # mechanical contact metadata the seating solver needs (insertion axis,
      # compatibility, or an inserting endpoint's seat frame), or when any
      # endpoint resolves inside a declared non-mechanical region such as a
      # Smart Cable port. Review-gated approximate metadata is reported but
      # does not fail.
      - run: npm run report:pins
