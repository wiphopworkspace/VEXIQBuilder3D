name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; let an in-flight production deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Pages serves the site at https://<user>.github.io/VEXIQBuilder3D/
          VITE_BASE_PATH: /VEXIQBuilder3D/
      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on first run (workflow build type).
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 30 minutes instead of the action's 10-minute default.
          #
          # 2026-08-06: every deploy that day died at exactly 10m0s-10m9s while
          # GitHub ran an open "Pages - Deployment Lag" incident. The same
          # deploys had been finishing in 10 SECONDS the day before, on an
          # artifact of the same size (42.5 MB, the failing one slightly
          # smaller than the last success), from a build that still took 40 s.
          #
          # The logs show the deployment never stalled: the status endpoint
          # kept answering `deployment_in_progress` right up to the cutoff,
          # with a single transient 5xx. So Pages was alive and working, just
          # slower than the action was willing to wait — and the action then
          # CANCELS the deployment it gave up on. One of those runs had
          # already published its content before being cancelled, which is how
          # a red workflow shipped a correct site and hid the problem for a
          # merge.
          #
          # This buys a slow backend the time to finish instead of turning
          # main red and leaving the site on the previous build. It does not
          # paper over a real failure: a deployment that genuinely breaks
          # still reports an error status and fails immediately.
          timeout: 1800000
