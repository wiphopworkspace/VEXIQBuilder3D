<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Real files, generated by `npm run icons:pwa`. The Vite starter's
         placeholder favicon was a 404 on every single load — nothing has ever
         written that file into public/. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- viewport-fit=cover lets the layout reach under an iPad's rounded
         corners / home indicator; the safe-area insets in styles.css keep the
         controls out from under them. maximum-scale pins the page so a
         two-finger pinch reaches OrbitControls' zoom instead of zooming the
         document out from under the canvas. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Installable + offline. The manifest uses RELATIVE urls ("./"), so the
         same file is correct at the domain root in dev and under the
         /VEXIQBuilder3D/ base on GitHub Pages — a manifest resolves its own
         urls against itself. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#171a21" />
    <meta name="apple-mobile-web-app-title" content="VEX IQ Builder" />
    <title>VEX IQ 3D Assembly Builder</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
